name: Test Bot

on:
  workflow_dispatch:
    inputs:
      save_only:
        description: "Save-only (default): GUARD.IAN forecasts one made-up question and nothing is posted to Metaculus. Untick to post to the unscored bot-testing area."
        type: boolean
        default: true

# Add concurrency group to prevent parallel runs
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false


# Daily job to run the simple forecast bot
jobs:
  forecast_job:
    runs-on: ubuntu-latest # determines the machine that will run the job - keep as is
    steps: # sets up the steps that will be run in order
      # setup repository with all necessary dependencies - keep as is
      - name: Check out repository
        uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.13.1"
      - name: Install dependencies
        run: uv sync --locked
      - name: Install A2A helper dependencies (pinned by package-lock.json)
        run: npm ci --ignore-scripts
      - name: Run bot
        run: |
          if [ "$SAVE_ONLY" = "false" ]; then
            uv run python main.py --mode test_questions --live
          else
            uv run python main.py --mode test_questions
          fi
        # this reads the environment variables from the github repository.
        # Store under Settings --> Secrets and variables --> Actions
        env:
          METACULUS_TOKEN: ${{ secrets.METACULUS_TOKEN }} # replace this with the name of the variable under which you stored your own Metaculus token
          PERPLEXITY_API_KEY: ${{ secrets.PERPLEXITY_API_KEY }}
          EXA_API_KEY: ${{ secrets.EXA_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          ASKNEWS_CLIENT_ID: ${{ secrets.ASKNEWS_CLIENT_ID }}
          ASKNEWS_SECRET: ${{ secrets.ASKNEWS_SECRET }}
          SAVE_ONLY: ${{ inputs.save_only }}
          GUARD_IAN_A2A_ENDPOINT: ${{ secrets.GUARD_IAN_A2A_ENDPOINT }}
          GUARD_IAN_ACCOUNT: ${{ secrets.GUARD_IAN_ACCOUNT }}
          A2A_SIGNING_KEY: ${{ secrets.A2A_SIGNING_KEY }}
          GUARD_IAN_PRIVATE_TERMS: ${{ secrets.GUARD_IAN_PRIVATE_TERMS }}